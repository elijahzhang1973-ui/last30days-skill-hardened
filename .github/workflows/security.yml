name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Block known vulnerabilities in the locked Python dependency graph.
      - name: Run uv audit against locked dependencies
        run: uv audit --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for diff-aware scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action derives the commit range from the GitHub event and fails on
      # verified secrets. Keep output limited to verified findings to avoid noisy
      # unverified annotations.
      - name: Run TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.1
          extra_args: --results=verified

  sast-scan:
    name: SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # v1.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The explicit registry ruleset works with telemetry disabled. Do not
      # use --config=auto here: Semgrep rejects auto config when metrics are
      # off, and continue-on-error would turn a scan setup failure green.
      - name: Run Semgrep SAST scan
        env:
          SEMGREP_SEND_METRICS: off
        run: semgrep scan --config=p/default --metrics=off --json --output semgrep-results.json

      - name: Validate audited Semgrep baseline
        run: >-
          python3 .github/scripts/validate_semgrep_baseline.py
          --results semgrep-results.json
          --baseline .github/semgrep-baseline.json

      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: semgrep-results.json
